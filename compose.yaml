services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DATABASE_USER:-auditoria}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-auditoria_local}
      POSTGRES_DB: ${POSTGRES_DB:-auditoria_development}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: .
    environment:
      RAILS_ENV: development
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-auditoria}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-auditoria_local}
      RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-5}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
