default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  port: <%= ENV.fetch("DATABASE_PORT", "5432") %>
  username: <%= ENV.fetch("DATABASE_USER", "auditoria") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "auditoria_local") %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

development:
  <<: *default
  database: auditoria_development

test:
  <<: *default
  database: auditoria_test

production:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "auditoria_production") %>
